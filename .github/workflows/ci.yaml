name: CI

on:
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest pytest-cov

      - name: Run API tests with coverage
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd api
          python -m pytest test_app.py -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=99

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Run UI tests with coverage
        run: |
          cd ui
          npx vitest run --coverage \
            --coverage.thresholds.lines=99

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: cd cli && go vet ./...

      - name: Test with coverage
        run: |
          cd cli
          go test ./internal/... -coverprofile=coverage.out
          coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { if (c < 90) { print "coverage below 90%"; exit 1 } }'

      - name: Build
        run: cd cli && go build ./...

      - name: Cross-OS compile smoke
        run: |
          cd cli
          GOOS=darwin  GOARCH=amd64 go build -o /tmp/ooshare-darwin-amd64 ./cmd/ooshare
          GOOS=darwin  GOARCH=arm64 go build -o /tmp/ooshare-darwin-arm64 ./cmd/ooshare
          GOOS=linux   GOARCH=amd64 go build -o /tmp/ooshare-linux-amd64 ./cmd/ooshare
          GOOS=linux   GOARCH=arm64 go build -o /tmp/ooshare-linux-arm64 ./cmd/ooshare
          GOOS=windows GOARCH=amd64 go build -o /tmp/ooshare-windows-amd64.exe ./cmd/ooshare
