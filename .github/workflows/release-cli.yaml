name: Release CLI

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  build:
    name: Build & sign
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hash artifacts (for SLSA subjects)
        id: hash
        working-directory: cli
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3.5.0

      - name: Sign artifacts (keyless)
        working-directory: cli
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for f in $(find dist -maxdepth 1 -type f | grep -E '\.(tar\.gz|zip|deb|rpm)$'); do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done

      - name: Attest provenance
        uses: slsa-framework/slsa-github-generator@v2.0.0
        with:
          base64-subjects: "${{ steps.hash.outputs.hashes }}"

      - name: Create release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: cli
        run: |
          set -euo pipefail
          # attach the SLSA attestation produced by the previous step
          cp "${{ github.workspace }}/attestation.intoto.jsonl" dist/
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes \
            --title "$GITHUB_REF_NAME"

  deploy-brew:
    name: Deploy Homebrew
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download darwin_arm64 archive + checksums
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release download "$TAG" \
            -p 'ooshare_*_darwin_arm64.tar.gz' -p 'SHA256SUMS' -D /tmp/rel
          sha="$(grep 'darwin_arm64.tar.gz' /tmp/rel/SHA256SUMS | awk '{print $1}')"
          test -n "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Generate formula
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          cat > /tmp/ooshare.rb <<'EOF'
          class Ooshare < Formula
            desc "Only Once Share CLI — one-time secret sharing from the terminal"
            homepage "https://ooshare.io"
            url "https://github.com/dhdtech/ooshare.io/releases/download/${TAG}/ooshare_${TAG#v}_darwin_arm64.tar.gz"
            sha256 "${SHA}"
            license "MIT"
            def install
              bin.install "ooshare"
            end
          end
          EOF
      - name: Push to homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          rm -rf tap && git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/dhdtech/homebrew-tap" tap
          cp /tmp/ooshare.rb tap/ooshare.rb
          cd tap
          git config user.name "ooshare-bot"
          git config user.email "bot@ooshare.io"
          git add ooshare.rb
          git commit -m "ooshare ${GITHUB_REF_NAME}"
          git push

  deploy-scoop:
    name: Deploy Scoop
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download windows_amd64 zip + checksums
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release download "$TAG" \
            -p 'ooshare_*_windows_amd64.zip' -p 'SHA256SUMS' -D /tmp/rel
          sha="$(grep 'windows_amd64.zip' /tmp/rel/SHA256SUMS | awk '{print $1}')"
          test -n "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Generate scoop manifest
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          cat > /tmp/ooshare.json <<EOF
          {
            "version": "${TAG#v}",
            "description": "Only Once Share CLI",
            "homepage": "https://ooshare.io",
            "license": "MIT",
            "url": "https://github.com/dhdtech/ooshare.io/releases/download/${TAG}/ooshare_${TAG#v}_windows_amd64.zip",
            "hash": "${SHA}",
            "bin": "ooshare.exe"
          }
          EOF
      - name: Push to scoop-bucket
        env:
          GH_TOKEN: ${{ secrets.BUCKET_REPO_TOKEN }}
        run: |
          rm -rf bucket && git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/dhdtech/scoop-bucket" bucket
          cp /tmp/ooshare.json bucket/ooshare.json
          cd bucket
          git config user.name "ooshare-bot"
          git config user.email "bot@ooshare.io"
          git add ooshare.json
          git commit -m "ooshare ${GITHUB_REF_NAME}"
          git push

  deploy-apt:
    name: Deploy apt repo
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download deb + set up key
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_KEY: ${{ secrets.OOSHARE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.OOSHARE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release download "$TAG" -p 'ooshare_*_linux_amd64.deb' -D /tmp/rel
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_KEY" | base64 -d > /tmp/key.asc
          gpg --batch --import /tmp/key.asc
      - name: Append deb + regenerate apt index
        env:
          GPG_PASSPHRASE: ${{ secrets.OOSHARE_GPG_PASSPHRASE }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf repo && git clone --depth 1 \
            "https://x-access-token:${PACKAGES_TOKEN}@github.com/dhdtech/ooshare-packages" repo
          mkdir -p repo/apt/stable/main/binary-amd64
          cp /tmp/rel/ooshare_*_linux_amd64.deb repo/apt/stable/main/binary-amd64/
          cd repo/apt/stable/main/binary-amd64
          apt-ftparchive packages . > Packages
          gzip -kf Packages
          cd "$GITHUB_WORKSPACE/repo/apt"
          cat > apt.conf <<'EOF'
          Dir { "."; };
          EOF
          apt-ftparchive -c apt.conf release stable > stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor -o stable/Release.gpg stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --clearsign -o stable/InRelease stable/Release
          cd "$GITHUB_WORKSPACE/repo"
          # public key for users
          gpg --armor --export ooshare@ooshare.io > apt/ooshare.gpg
          git config user.name "ooshare-bot"
          git config user.email "bot@ooshare.io"
          git add -A
          git commit -m "apt: ooshare ${GITHUB_REF_NAME}" || true
          git push

  deploy-yum:
    name: Deploy yum repo
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download rpm + set up key
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_KEY: ${{ secrets.OOSHARE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -p 'ooshare_*_linux_amd64.rpm' -D /tmp/rel
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_KEY" | base64 -d > /tmp/key.asc
          gpg --batch --import /tmp/key.asc
      - name: Append rpm + regenerate yum index
        env:
          GPG_PASSPHRASE: ${{ secrets.OOSHARE_GPG_PASSPHRASE }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf repo && git clone --depth 1 \
            "https://x-access-token:${PACKAGES_TOKEN}@github.com/dhdtech/ooshare-packages" repo
          mkdir -p repo/rpm
          cp /tmp/rel/ooshare_*_linux_amd64.rpm repo/rpm/
          cd repo/rpm
          createrepo_c .   # generates repodata/repomd.xml
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor -o repodata/repomd.xml.asc repodata/repomd.xml
          cd "$GITHUB_WORKSPACE/repo"
          gpg --armor --export ooshare@ooshare.io > rpm/ooshare.gpg
          git config user.name "ooshare-bot"
          git config user.email "bot@ooshare.io"
          git add -A
          git commit -m "yum: ooshare ${GITHUB_REF_NAME}" || true
          git push

  deploy-winget:
    name: Deploy winget (PR)
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download $env:GITHUB_REF_NAME -p 'ooshare_*_windows_amd64.zip' -D ./rel
      - name: Open winget PR
        uses: vedantmgoyal2009/winget-releaser@latest
        with:
          identifier: dhdtech.ooshare
          installers-regex: 'ooshare_.*windows_amd64\.zip$'
          # GITHUB_TOKEN (scoped to this repo only) is sufficient: the
          # winget-releaser action opens the winget-pkgs PR itself using its
          # own short-lived token, not ours.
          token: ${{ secrets.GITHUB_TOKEN }}
