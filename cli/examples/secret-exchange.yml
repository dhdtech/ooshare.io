# Blueprint — adapt tag/paths before enabling. The CLI is installed by downloading
# the release binary, then used to create a secret and reveal it later.
name: Secret exchange

on:
  workflow_dispatch:

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Download ooshare CLI
        env:
          VERSION: cli-v0.1.0 # bump with each release
        run: |
          curl -fsSL "https://github.com/dhdtech/only-once-share/releases/download/${VERSION}/ooshare-linux-amd64" -o ooshare
          chmod +x ooshare
          ./ooshare version

      - name: Create a secret and capture its URL
        id: create
        env:
          SECRET: ${{ secrets.EXAMPLE_SECRET }}
        run: |
          URL="$(./ooshare create --json --text "$SECRET" --ttl 24 | jq -r .url)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Reveal the secret in a later step
        env:
          EXPECTED: ${{ secrets.EXAMPLE_SECRET }}
        run: |
          ./ooshare view "${{ steps.create.outputs.url }}" > revealed.txt
          test "$(cat revealed.txt)" = "${EXPECTED}"
          echo "round-trip OK"
