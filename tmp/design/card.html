<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:"Inter"; font-style:normal; font-weight:400 700; font-display:block; src:url("/fonts/inter-latin.woff2") format("woff2"); unicode-range:U+0000-00FF,U+2000-206F; }
  @font-face { font-family:"JetBrains Mono"; font-style:normal; font-weight:400 700; font-display:block; src:url("/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); unicode-range:U+0000-00FF,U+2000-206F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:440px; height:280px; }
  body {
    font-family:"Inter", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    position:relative;
    color:#e7eaf3;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(99,102,241,0.28) 0%, rgba(79,70,229,0.10) 42%, transparent 62%),
      linear-gradient(168deg, #0b1020 0%, #0e1526 52%, #111831 100%);
  }
  /* fine security grid */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(99,102,241,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.055) 1px, transparent 1px);
    background-size:22px 22px;
    mask-image:radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 78%);
    -webkit-mask-image:radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 78%);
  }
  /* vignette */
  .vig { position:absolute; inset:0; background:radial-gradient(90% 90% at 50% 50%, transparent 62%, rgba(4,6,15,0.5) 100%); }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:20px 26px; }

  .brand-row { display:flex; align-items:center; gap:9px; margin-bottom:12px; }
  .shield-wrap {
    width:44px; height:44px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(99,102,241,0.16), rgba(99,102,241,0.05));
    border:1px solid rgba(129,140,248,0.38);
    box-shadow:0 0 0 1px rgba(11,16,32,0.6), 0 0 26px -6px rgba(99,102,241,0.75), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .shield-wrap svg { width:27px; height:27px; display:block; }
  .wordmark { font-family:"JetBrains Mono", monospace; font-weight:700; font-size:15px; letter-spacing:0.12em; color:#e7eaf3; }
  .wordmark span { color:#818cf8; }

  h1 { font-size:27px; line-height:1.16; font-weight:700; letter-spacing:-0.02em; text-align:center; color:#e7eaf3; }
  h1 .grad {
    background:linear-gradient(92deg, #a5b4fc 0%, #818cf8 45%, #6366f1 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  }

  .chips { display:flex; gap:7px; margin-top:15px; flex-wrap:wrap; justify-content:center; }
  .chip {
    font-family:"JetBrains Mono", monospace; font-size:9px; font-weight:400; letter-spacing:0.09em;
    color:#aeb6cc; padding:4px 9px; border-radius:999px;
    background:rgba(99,102,241,0.08);
    border:1px solid rgba(158,168,200,0.16);
  }
  .chip b { color:#c7d2fe; font-weight:700; }

  .secure-strip {
    margin-top:16px; display:flex; align-items:center; gap:8px;
    font-family:"JetBrains Mono", monospace; font-size:8.5px; letter-spacing:0.16em; color:#828ba4;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,0.16), 0 0 12px rgba(52,211,153,0.8); }
  .sep { width:1px; height:11px; background:rgba(158,168,200,0.22); }
  .secure-strip .hl { color:#6ee7b7; }

  /* faint floating key + lock accents */
  .deco { position:absolute; color:rgba(165,180,252,0.10); }
  .d1 { left:26px; top:26px; }
  .d2 { right:26px; top:24px; }
  .d3 { left:38px; bottom:22px; }
  .d4 { right:36px; bottom:20px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="vig"></div>

  <svg class="deco d1" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
  <svg class="deco d2" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <svg class="deco d3" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
  <svg class="deco d4" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>

  <div class="wrap">
    <div class="brand-row">
      <div class="shield-wrap">
        <svg viewBox="0 0 24 24">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a5b4fc"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
            </linearGradient>
          </defs>
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" fill="url(#sg)"/>
          <path d="M12 9.5c1.4 0 2.5 1.05 2.5 2.4 0 1.02-.63 1.9-1.55 2.28l.6 2.02h-3.1l.6-2.02A2.54 2.54 0 0 1 9.5 11.9c0-1.35 1.1-2.4 2.5-2.4z" fill="#0b1020"/>
        </svg>
      </div>
      <div class="wordmark">oo<span>share</span></div>
    </div>

    <h1>One-time secrets.<br/><span class="grad">Zero knowledge.</span></h1>

    <div class="chips">
      <div class="chip"><b>AES-256-GCM</b></div>
      <div class="chip">END-TO-END</div>
      <div class="chip">AUTO-DELETE</div>
    </div>

    <div class="secure-strip">
      <div class="dot"></div>
      <span class="hl">SECURE</span>
      <div class="sep"></div>
      <span>ENCRYPTED BEFORE UPLOAD</span>
    </div>
  </div>
</body>
</html>
