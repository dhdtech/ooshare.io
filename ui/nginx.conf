server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # ─── Security Headers ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: script-src has NO 'unsafe-inline'. The inline gtag bootstrap in index.html
    # is allowed only via its exact SHA-256 hash (CSP3: leading/trailing whitespace stripped).
    # If you change that snippet, recompute the hash: node -e 'crypto hash of script text'.
    # us-assets.i.posthog.com stays because posthog-js autocapture/surveys inject runtime scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://us-assets.i.posthog.com 'sha256-1y4zwthhqQEdLF73HfmqVL/rzabI5lDfD6HDhTaYMgQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com; connect-src 'self' https://api.ooshare.io https://oos-api.onrender.com https://us.i.posthog.com https://us-assets.i.posthog.com https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self' https://us-assets.i.posthog.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt, sitemap, and llms.txt — short cache
    location = /robots.txt {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /sitemap.xml {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /llms.txt {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Dynamic secret routes — SPA fallback
    location /s/ {
        try_files $uri /index.html;
    }

    # Serve pre-rendered HTML if available, or 404
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
